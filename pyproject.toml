[tool.bandit]
[tool.ruff]
line-length = 100
target-version = 'py312'
exclude = [
    'src/hd_active/ui/forms',
    '.venv*',
    'venv*',
    '.git',
    '.github',
    'assets',
    'build',
    'dist',
    'docs',
    'site',
    '__pycache__',
]

[tool.ruff.lint]
select = ['E', 'F', 'W', 'I']
extend-ignore = ['E203', 'E701', 'F811']

[tool.ruff.format]
quote-style = 'single'

[tool.pytest.ini_options]
# Markers: See documentation on what markers represent.
markers = ['windows']
testpaths = ['tests']

[tool.ty.environment]
python-version = '3.12'

[tool.ty.src]
# Generated Qt code, don't type check.
exclude = ['src/hd_active/ui/forms']

[tool.typer-invoke]
# Paths from where `pyproject.toml` is located (root of project)
modules = [
    'admin.build',
    'admin.docs',
    'admin.lint',
    'admin.precommit',
    'admin.test',
    'admin.ui',
]
no_args_is_help = true
add_completion = false
rich_markup_mode = 'markdown'
log_level = 'INFO'
log_format = '%(message)s'

[build-system]
requires = ['uv_build>=0.13.8,<0.14.0']
build-backend = 'uv_build'

[tool.uv.build-backend]
module-name = 'hd_active'

[project]
name = 'hd_active'
version = '0.3.0'
description = 'Prevent external HDs from becoming inactive (sleeping).'
readme = 'README.md'
authors = [{name = 'Joao Coelho'}]
license = 'MIT'
license-files = ['LICENSE.txt']
dependencies = ['pyside6']
requires-python = '>=3.12,<3.16'
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Programming Language :: Python :: 3.15",
]

[project.urls]
Home = 'https://github.com/joaonc/hd_active'
Documentation = 'https://joaonc.github.io/hd_active'

[project.scripts]
hd_active = 'hd_active.cli:main'
[dependency-groups]
dev = [
    'bandit',
    'pre-commit',
    'pytest',
    'pytest-params',
    'pytest-qt',
    'ruff',
    'ty',
    'typer',
    'typer-invoke',
]
docs = [
    'mdx_truly_sane_lists',
    'mkdocs',
    'mkdocs-glightbox',
    'mkdocs-material',
]

[tool.uv]
default-groups = ['dev']
